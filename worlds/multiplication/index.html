<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiplication Village — The Young Foundry</title>
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/world.css" />
  <link rel="stylesheet" href="multiplication.css" />
</head>
<body>

  <!-- ── HUD ─────────────────────────────────────── -->
  <nav id="platform-hud">
    <a class="hud-logo" href="../../index.html">
      <span>🏭</span>
      <span><span class="tyf">Young</span> <span class="foundry">Foundry</span></span>
    </a>
    <div class="hud-stats">
      <div class="hud-stat hud-xp">
        <span class="icon">⚡</span>
        <span id="hud-xp-val">0</span>
        <span class="label" style="font-size:0.75rem;opacity:0.7">XP</span>
      </div>
      <div class="hud-stat hud-coin">
        <span class="icon">🪙</span>
        <span id="hud-coin-val">0</span>
      </div>
      <div class="hud-stat" style="background:var(--world-primary);color:white;padding:4px 12px;border-radius:var(--r-full);font-size:0.85rem">
        Lv <span id="hud-level-val">1</span>
        <div class="xp-bar-track" style="width:48px;margin-left:8px">
          <div class="xp-bar-fill" id="hud-xp-bar" style="width:0%"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ── WORLD HEADER ────────────────────────────── -->
  <header class="world-header">
    <a href="../../index.html" class="back-link">← World Map</a>
    <div class="world-emoji">🏘️</div>
    <h1>Multiplication Village</h1>
    <p>Counting one-by-one is slow. Discover the shortcut mathematicians invented.</p>
    <div class="world-tier" id="world-tier"></div>
  </header>

  <!-- ── ACTIVITY MAP ────────────────────────────── -->
  <main class="academy">
    <div class="activity-trail" id="activity-trail">
      <!-- Rendered by JS -->
    </div>

    <!-- ── ACTIVITY STAGE ────────────────────────── -->
    <section class="stage card" id="stage" hidden>
      <div class="stage-head">
        <h2 id="stage-title"></h2>
        <button class="btn btn-secondary btn-sm" id="stage-close">✕ Close</button>
      </div>
      <div id="stage-body"></div>
    </section>
  </main>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="../../js/engine.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/tutor.js"></script>
  <script src="../../js/world-common.js"></script>
  <script src="multiplication.js"></script>
</body>
</html>
